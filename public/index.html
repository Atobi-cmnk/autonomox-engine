<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TobiasPay Demo</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 2rem; line-height: 1.4; }
    h1 { margin-bottom: 0.25rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    label { display: block; margin-top: 0.5rem; }
    input, textarea, select { width: 100%; padding: 0.5rem; margin-top: 0.25rem; }
    button { margin-top: 0.75rem; padding: 0.6rem 1rem; cursor: pointer; }
    pre { background: #f6f8fa; padding: 0.75rem; border-radius: 6px; overflow: auto; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>TobiasPay Demo</h1>
  <p>This demo simulates payments (no real funds) and returns a signed, verifiable receipt plus an append-only audit log.</p>

  <div class="row">
    <div class="card">
      <h2>Simulate Payment</h2>
      <label>Amount <input id="amount" type="number" step="0.01" value="12.34" /></label>
      <label>Currency <input id="currency" value="USD" /></label>
      <label>From <input id="from" value="alice@example.com" /></label>
      <label>To <input id="to" value="bob@example.com" /></label>
      <label>Note <input id="note" placeholder="Optional" /></label>
      <button id="payBtn">Simulate</button>
      <div id="payResult"></div>
    </div>

    <div class="card">
      <h2>Verify Receipt Signature</h2>
      <label>Receipt JSON
        <textarea id="receiptJson" rows="8" placeholder="Paste receipt JSON here"></textarea>
      </label>
      <label>Signature (base64)
        <input id="signatureB64" placeholder="Paste signature here" />
      </label>
      <button id="verifySigBtn">Verify Signature</button>
      <div id="verifySigResult"></div>
    </div>
  </div>

  <div class="card">
    <h2>Verify Audit Log</h2>
    <button id="verifyLogBtn">Verify Log</button>
    <div id="verifyLogResult"></div>
  </div>

  <script>
    const payBtn = document.getElementById('payBtn');
    const payResult = document.getElementById('payResult');
    const receiptJson = document.getElementById('receiptJson');
    const signatureB64 = document.getElementById('signatureB64');
    const verifySigBtn = document.getElementById('verifySigBtn');
    const verifySigResult = document.getElementById('verifySigResult');
    const verifyLogBtn = document.getElementById('verifyLogBtn');
    const verifyLogResult = document.getElementById('verifyLogResult');

    payBtn.addEventListener('click', async () => {
      payResult.textContent = 'Processing...';
      const body = {
        amount: Number(document.getElementById('amount').value),
        currency: document.getElementById('currency').value,
        from: document.getElementById('from').value,
        to: document.getElementById('to').value,
        note: document.getElementById('note').value
      };
      const res = await fetch('/api/payments/simulate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      payResult.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
      receiptJson.value = JSON.stringify(data.receipt, null, 2);
      signatureB64.value = data.signature || '';
    });

    verifySigBtn.addEventListener('click', async () => {
      verifySigResult.textContent = 'Verifying...';
      try {
        const receipt = JSON.parse(receiptJson.value);
        const signature = signatureB64.value;
        const res = await fetch('/api/verify/signature', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ receipt, signature })
        });
        const data = await res.json();
        verifySigResult.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
      } catch (e) {
        verifySigResult.textContent = 'Invalid JSON';
      }
    });

    verifyLogBtn.addEventListener('click', async () => {
      verifyLogResult.textContent = 'Checking...';
      const res = await fetch('/api/verify/log');
      const data = await res.json();
      verifyLogResult.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
    });
  </script>
</body>
</html>
